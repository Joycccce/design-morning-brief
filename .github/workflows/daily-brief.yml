name: Design Intelligence Brief

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: "test-feishu"
        type: choice
        options:
          - test-feishu
          - dry-run
          - full
  schedule:
    - cron: "7 8 * * *"
      timezone: "Asia/Singapore"

permissions:
  contents: write

concurrency:
  group: design-intelligence-brief
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      GEMINI_MODEL: gemini-3.5-flash
      REPORT_TIMEZONE: Asia/Singapore
      MIN_SCORE: "72"
      TARGET_ITEMS: "6"
      MAX_ITEMS: "8"
      HISTORY_FRESH_DAYS: "45"
      HISTORY_CLASSIC_DAYS: "180"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q src

      - name: Run tests
        run: pytest -q

      - name: Run design intelligence brief
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="full"; fi
          echo "RUN MODE=$MODE"
          python src/main.py --mode "$MODE"

      - name: Persist selected-source history
        if: success() && (github.event_name == 'schedule' || github.event.inputs.mode == 'full')
        continue-on-error: true
        run: |
          git config user.name "design-brief-bot"
          git config user.email "design-brief-bot@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update design brief history [skip ci]"
            git push
          fi

      - name: Upload debug outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-intelligence-brief-output-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
